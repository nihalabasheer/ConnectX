plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.connectx"  // Fixed

    compileSdk 35  // Explicitly set latest compileSdk

    defaultConfig {
        applicationId "com.example.connectx"
        minSdk 23
        targetSdk 34  // Explicitly set latest targetSdk
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"  // Fixed string format
    }

    buildTypes {
        release {
            if (signingConfigs.debug != null) {  // Prevent null crash
                signingConfig signingConfigs.debug
            }
            //minifyEnabled true
            //shrinkResources true
            //proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source "../.."
}
